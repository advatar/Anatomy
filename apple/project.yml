name: AnatomyAtelier
options:
  bundleIdPrefix: com.advatar
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    tvOS: "26.0"
    visionOS: "2.0"
  developmentLanguage: en
  xcodeVersion: "26.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_PREVIEWS: YES
    PRODUCT_NAME: Anatomy Atelier
packages:
  AnatomyRealityContent:
    path: Packages/AnatomyRealityContent
targets:
  AnatomyAtelier:
    type: application
    supportedDestinations: [iOS, macOS, tvOS, visionOS]
    deploymentTarget:
      iOS: "18.0"
      macOS: "15.0"
      tvOS: "26.0"
      visionOS: "2.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.advatar.anatomyatelier
        PRODUCT_MODULE_NAME: AnatomyAtelier
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: AnatomyRealityContent
        product: AnatomyRealityContent
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Anatomy Atelier
        CFBundleName: Anatomy Atelier
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      gatherCoverageData: true
      testTargets:
        - AnatomyAtelierTests
  AnatomyAtelierTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS, tvOS, visionOS]
    deploymentTarget:
      iOS: "18.0"
      macOS: "15.0"
      tvOS: "26.0"
      visionOS: "2.0"
    sources:
      - path: Tests
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Anatomy Atelier.app/Anatomy Atelier"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Anatomy Atelier.app/Contents/MacOS/Anatomy Atelier"
    dependencies:
      - target: AnatomyAtelier
